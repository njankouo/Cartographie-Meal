name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-django:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Configurer Python sur la machine virtuelle
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Mettre en cache les dépendances pip
      - name: Mise en cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Installer les dépendances Python
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Vérifier les migrations manquantes
      - name: Vérifier les migrations Django
        run: |
          python manage.py makemigrations --check --dry-run

      # 6. Exécuter les tests unitaires Django
      - name: Lancer les tests Django
        run: |
          python manage.py test