# .github/workflows/ci-cd.yml
# Pipeline MEAL Afrique : tests → image Docker → déploiement sur le VPS.
# Version corrigée et commentée. Chaque modification par rapport à l'original est marquée « CORRIGÉ ».

name: Django CI/CD (GHCR & Docker)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io

# CORRIGÉ : deux déploiements ne doivent jamais tourner en même temps sur le VPS.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────── 1. TESTS ───────────────────────────
  test-django:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:                     # variables lues par settings.py pendant les tests
      DB_NAME: django_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pas-un-secret   # CORRIGÉ : pas besoin du vrai secret pour tester

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier qu'aucune migration n'a été oubliée      # CORRIGÉ : ajouté
        run: python manage.py makemigrations --check --dry-run

      - name: Exécuter les tests Django
        run: python manage.py test

  # ─────────────────────────── 2. IMAGE DOCKER ───────────────────────────
  build-and-push:
    needs: test-django
    # CORRIGÉ : on ne publie l'image que pour un push sur main/master, jamais pour une pull request.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.nom.outputs.image }}

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      # CORRIGÉ : GHCR exige un nom en minuscules ; « Cartographie-Meal » ferait échouer le push.
      - name: Calculer le nom de l'image en minuscules
        id: nom
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Se connecter à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # CORRIGÉ : en plus de latest, une étiquette par commit pour pouvoir revenir en arrière.
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────── 3. DÉPLOIEMENT ───────────────────────────
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production        # CORRIGÉ : permet d'exiger une approbation (Settings → Environments)

    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e                                   # CORRIGÉ : s'arrêter à la première erreur
            cd /home/Cartographie-Meal

            # 1. Mettre à jour docker-compose.yml et les fichiers de configuration
            git pull origin main

            # 2. Connexion à GHCR avec un jeton dédié en lecture seule (CORRIGÉ, voir explications)
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            # 3. Télécharger la nouvelle image
            docker compose pull

            # 4. CORRIGÉ : migrations AVANT de remplacer les conteneurs, avec la nouvelle image
            docker compose run --rm web python manage.py migrate --noinput

            # 5. CORRIGÉ : remplacer seulement les conteneurs qui ont changé, sans tout arrêter
            docker compose up -d --remove-orphans

            # 6. Fichiers statiques, dans le conteneur web en service
            docker compose exec -T web python manage.py collectstatic --noinput

            # 7. Ménage : supprimer les anciennes images et se déconnecter
            docker image prune -f
            docker logout ghcr.io