name: Django CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-django:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source du projet
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer les dépendances système et outils de compilation pour Cairo
      - name: Installer les bibliothèques et outils système pour Pycairo
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config meson ninja-build python3-dev

      # 3. Configurer Python sur la machine virtuelle
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Mettre en cache les dépendances pip pour accélérer les futurs runs
      - name: Mise en cache des dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 5. Installer les dépendances Python (avec le chemin pkg-config explicite)
      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 6. Vérifier les migrations manquantes
      - name: Vérifier les migrations Django
        run: |
          python manage.py makemigrations --check --dry-run

      # 7. Exécuter les tests unitaires Django
      - name: Lancer les tests Django
        run: |
          python manage.py test