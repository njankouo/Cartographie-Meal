# ==============================================================================
# Nom du workflow CI/CD pour Django
# ==============================================================================
name: Django CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-django:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            libffi-dev \
            libpq-dev

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Appliquer les migrations Django
        run: |
          python manage.py migrate
        env:
          DB_NAME: django_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      - name: Lancer les tests Django
        run: |
          python manage.py test
        env:
          DB_NAME: django_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

  deploy:
    needs: test-django
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Connexion au serveur et déploiement via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Chemin absolu exact sur votre serveur
            cd /home/Cartographie-Meal
            
            git pull origin main
            
            # S'assure qu'on utilise un venv avec un python récent s'il existe, sinon python3
            if command -v python3.11 &> /dev/null; then
                python3.11 -m venv venv
            else
                python3 -m venv venv
            fi
            
            # Activation et installation forcée des dépendances dans le venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Exécution explicite des commandes Django via le venv
            ./venv/bin/python manage.py migrate
            ./venv/bin/python manage.py collectstatic --noinput
            
            # Redémarrage du service Gunicorn (remplacez 'gunicorn' par le nom exact de votre service si besoin)
            sudo systemctl restart gunicorn || sudo systemctl restart gunicorn.service