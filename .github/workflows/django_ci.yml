# ==============================================================================
# Nom du workflow CI/CD pour Django
# ==============================================================================
name: Django CI

# Déclencheurs : s'exécute à chaque push ou pull request sur main ou master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Définition des tâches (jobs)
jobs:
  test-django:
    runs-on: ubuntu-latest

    # ==========================================================================
    # Service PostgreSQL éphémère pour les tests (valeurs de test standard)
    # ==========================================================================
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Health check pour s'assurer que la base est prête avant les tests
        options: >-
          --health-cmd "pg_isready -U postgres -d django_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # ==========================================================================
    # Étapes de la tâche (Steps)
    # ==========================================================================
    steps:
      # 1. Récupération du code source
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installation des dépendances système (nécessaires pour Cairo / pycairo / PostgreSQL)
      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            libffi-dev \
            libpq-dev

      # 3. Configuration de Python 3.11 avec cache pip activé
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 4. Mise à jour de pip et installation des dépendances du projet
      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Application des migrations sur la base de données de test
      - name: Appliquer les migrations Django
        run: |
          python manage.py migrate
        env:
          DB_NAME: django_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}

      # 6. Exécution des tests unitaires et d'intégration
      - name: Lancer les tests Django
        run: |
          python manage.py test
        env:
          DB_NAME: django_test_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}