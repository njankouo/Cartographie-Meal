   <section class="step" data-step="1" aria-labelledby="h1">
          <header class="step-head">
            <span class="num">Étape 1 sur 5</span>
            <h2 id="h1">Identification et organisation</h2>
            <p class="en" lang="en">Identification and organization details</p>
            <p class="lead">Vos coordonnées et votre organisation, telles qu'elles apparaîtront sur la cartographie.</p>
          </header>

          <div class="field">
            <label for="nomComplet">Nom complet<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">full name</span></label>
            <input type="text" id="nomComplet" autocomplete="name" required value="{{ personnel.nom }}" name="nomComplet">
            <p class="error" id="err-nomComplet" role="alert"></p>
          </div>

        <div class="grid2">
    <!-- PAYS -->
    <div class="field">
      <label for="pays">Pays de résidence<span class="req" aria-hidden="true">*</span></label>
      <select id="pays" required onchange="onPaysChange()" name="pays">
        <option value="">Sélectionner un pays</option>
        {% for pays in countries %}
            <option value="{{ pays.name }}" {% if personnel.pays == pays.name %}selected{% endif %}>
                {{ pays.name }}
            </option>
        {% endfor %}
      </select>
      <p class="error" id="err-pays" role="alert"></p>
    </div>

    <!-- VILLE -->
    <div class="field">
      <label for="ville">Ville</label>
      <!-- On utilise personnel.ville car c'est là que se trouve la valeur "30640" -->
      <select id="ville" name="ville" data-saved-ville="{{ personnel.ville|default:'' }}">
        <option value="">Choisissez d'abord un pays</option>
      </select>
      <input type="text" id="villeAutre" hidden placeholder="Précisez la ville">
      <p class="error" id="err-villeAutre" role="alert"></p>
    </div>
</div>

          <div class="grid2">
            <div class="field">
              <label for="email">Adresse email<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">email</span></label>
              <input type="email" id="email" autocomplete="email" required value="{{ personnel.mail }}" name="email">
              <p class="error" id="err-email" role="alert"></p>
            </div>
            <div class="field">
              <label for="telephone">Téléphone / WhatsApp<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">phone</span></label>
              <input type="tel" id="telephone" autocomplete="tel" placeholder="+237 6XX XXX XXX" required value="{{ personnel.tel }}" name="telephone">
              <p class="error" id="err-telephone" role="alert"></p>
            </div>
          </div>

          <div class="grid2">
            <fieldset class="field">
              <legend>Sexe<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">gender</span></legend>
              <div class="choices">
                <label class="choice"><input type="radio" name="sexe" value="F" {% if personnel.sexe == 'F' %}checked{% endif %}><span>Féminin</span></label>
                <label class="choice"><input type="radio" name="sexe" value="M" {% if personnel.sexe == 'M' %}checked{% endif %}><span>Masculin</span></label>
                <label class="choice"><input type="radio" name="sexe" value="NP"><span>Non précisé</span></label>
              </div>
              <p class="error" id="err-sexe" role="alert"></p>
            </fieldset>
            <div class="field">
              <label for="linkedin">Profil LinkedIn<span class="en-label" lang="en">optional</span></label>
              <input type="text" id="linkedin" placeholder="linkedin.com/in/votre-nom" autocomplete="url" name="linkedin" value="{{personnel.profil_linkedin}}">
            </div>
          </div>

         <div class="grid2">
    <!-- Type d'organisation -->
    <div class="field">
      <label for="typeOrg">Type d'organisation<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">organization type</span></label>
      <select id="typeOrg" required onchange="onTypeOrgChange()" name='typeOrg'>
        <option value="">Sélectionner</option>
        <option value="ONG" {% if personnel.organization_type == "ONG" %}selected{% endif %}>ONG internationale</option>
        <option value="ONG-N" {% if personnel.organization_type == "ONG-N" %}selected{% endif %}>ONG nationale</option>
        <option value="Gouvernement" {% if personnel.organization_type == "Gouvernement" %}selected{% endif %}>Gouvernement</option>
        <option value="ONU" {% if personnel.organization_type == "ONU" %}selected{% endif %}>Agence des Nations Unies</option>
        <option value="Bailleur" {% if personnel.organization_type == "Bailleur" %}selected{% endif %}>Bailleur de fonds</option>
        <option value="Recherche" {% if personnel.organization_type == "Recherche" %}selected{% endif %}>Université / Recherche</option>
        <option value="Prive" {% if personnel.organization_type == "Prive" %}selected{% endif %}>Cabinet / Secteur privé</option>
        <option value="__autre" {% if personnel.organization_type == "__autre" %}selected{% endif %}>Autre</option>
      </select>
      <input type="text" id="typeOrgAutre" hidden placeholder="Précisez le type" aria-label="Précisez le type d'organisation">
      <p class="error" id="err-typeOrg" role="alert"></p>
    </div>

    <!-- Fonction occupée -->
    <div class="field">
      <label for="fonctionOrg">Fonction occupée<span class="req" aria-hidden="true">*</span><span class="en-label" lang="en">position</span></label>
      <select id="fonctionOrg" required onchange="onFonctionChange()" name='fonctionOrg'>
        <option value="">Sélectionner</option>
        <option value="Responsable MEAL" {% if personnel.fonction_organization == "Responsable MEAL" %}selected{% endif %}>Responsable MEAL</option>
        <option value="Consultant" {% if personnel.fonction_organization == "Consultant" %}selected{% endif %}>Consultant MEAL</option>
        <option value="Charge SE" {% if personnel.fonction_organization == "Charge SE" %}selected{% endif %}>Chargé de suivi-évaluation</option>
        <option value="Analyste" {% if personnel.fonction_organization == "Analyste" %}selected{% endif %}>Analyste de données</option>
        <option value="Chercheur" {% if personnel.fonction_organization == "Chercheur" %}selected{% endif %}>Chercheur / Enseignant</option>
        <option value="__autre" {% if personnel.fonction_organization == "__autre" %}selected{% endif %}>Autre</option>
      </select>
      <input type="text" id="fonctionOrgAutre" hidden placeholder="Précisez la fonction" aria-label="Précisez la fonction">
      <p class="error" id="err-fonctionOrg" role="alert"></p>
    </div>
</div>
        </section>
